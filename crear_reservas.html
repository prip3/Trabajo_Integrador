<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva reserva - Reserva de Espacios</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="cabecera">
        <h1>📅 Reserva de Espacios</h1>
        <p>Escuela Experimental ProA</p>
    </header>

    <!-- Menú de navegación entre páginas -->
    <nav class="menu" aria-label="Páginas de la aplicación">
        <a href="index.html">Inicio</a>
        <a href="crear_reservas.html" aria-current="page" class="activo">Nueva reserva</a>
        <a href="ver_reservas.html">Ver reservas</a>
        <a href="crear_espacios.html">Nuevo espacio</a>
        <a href="ver_espacios.html">Ver espacios</a>
        <a href="crear_usuarios.html">Nuevo usuario</a>
        <a href="ver_usuarios.html">Ver usuarios</a>
        <a href="ver_resumen.html">Resumen</a>
    </nav>

    <!-- Mensajes de éxito/error (los leen los lectores de pantalla) -->
    <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>

    <main>
        <section class="vista">
            <h2>Nueva reserva</h2>
            <form id="form-reserva" class="grid-form">
                <div class="campo"><label for="res-usuario">Quién reserva</label>
                    <select id="res-usuario" required></select></div>
                <div class="campo"><label for="res-espacio">Espacio</label>
                    <select id="res-espacio" required></select></div>
                <div class="campo"><label for="res-fecha">Fecha</label>
                    <input type="date" id="res-fecha" required></div>
                <div class="campo"><label for="res-franja">Horario</label>
                    <select id="res-franja" required></select></div>
                <div class="campo ancho"><label for="res-motivo">Motivo</label>
                    <input type="text" id="res-motivo" placeholder="Ej: Clase de Programación IV" required></div>
                <button type="submit">Reservar</button>
            </form>
            <p id="aviso-faltan-datos" class="vacio" hidden>Para reservar primero cargá al menos un <a href="crear_espacios.html">espacio</a> y un <a href="crear_usuarios.html">usuario</a>.</p>
            <p><a href="ver_reservas.html">Ver todas las reservas →</a></p>
        </section>
    </main>

    <footer>Programación IV · Escuela Experimental ProA</footer>

    <!-- Primero las clases (modelos), después la interfaz que las usa -->
    <script src="js/modelos.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
